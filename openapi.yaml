openapi: 3.0.0
info:
  title: CodeRevAI API
  version: 1.0.0
  description: API for automated code reviews using AI.
servers:
  - url: http://localhost:3000
    description: Local Development Server
paths:
  /api/review-code:
    post:
      summary: Review a code snippet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - language
              properties:
                code:
                  type: string
                  description: The code snippet to review.
                language:
                  type: string
                  description: The programming language of the code.
                customPrompt:
                  type: string
                  description: Optional custom instructions for the AI reviewer.
                reviewModes:
                  type: array
                  items:
                    type: string
                    enum: [comprehensive, security, performance, clean-code]
                  description: Selected review modes.
      responses:
        '200':
          description: Successful review
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback:
                    type: string
                    description: The AI-generated code review.
        '400':
          description: Invalid input
        '401':
          description: Unauthorized - Invalid API Key
        '429':
          description: Rate limit exceeded

  /api/review-repo:
    post:
      summary: Review a repository
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - files
                - repoUrl
              properties:
                files:
                  type: array
                  items:
                    type: object
                    required:
                      - path
                      - content
                    properties:
                      path:
                        type: string
                      content:
                        type: string
                  description: List of files from the repository to review.
                repoUrl:
                  type: string
                  description: URL of the repository (for context).
                customPrompt:
                  type: string
                reviewModes:
                  type: array
                  items:
                    type: string
                    enum: [comprehensive, security, performance, clean-code]
      responses:
        '200':
          description: Successful review
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback:
                    type: string
        '400':
          description: Invalid input or repository too large
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
